#:schema https://raw.githubusercontent.com/feds01/zenith/main/zenith.schema.json

[contracts.packages-acyclic]
type = "acyclic"
modules = ["pkg:*"]

# These workspace packages stack in layers: each depends only on the layers below it.
[contracts.packages-layers]
type = "layers"
layers = ["pkg:@durachok/web", "pkg:@durachok/server", "pkg:@durachok/engine", "pkg:@durachok/transport"]

[contracts.web-imports-server-types-only]
type = "forbidden"
name = "The web client only imports types from the server"
from = ["pkg:@durachok/web"]
to = ["pkg:@durachok/server"]
exclude_kinds = ["type"]
guidance = "Use `import type` for the tRPC router types, so no server code ends up in the browser bundle."

[contracts.browser-code-avoids-node-builtins]
type = "forbidden"
name = "Code that ships to the browser doesn't import Node builtins"
from = ["apps/web/src", "packages/engine/src", "packages/transport/src"]
to = ["node:*"]
exclude_kinds = ["type"]
# `buffer` is the npm polyfill, which both packages depend on, not the builtin.
ignore_imports = ["apps/web/src -> node:buffer", "packages/transport/src -> node:buffer"]
guidance = "The web app bundles the engine and transport packages, so keep Node-only code in the server."

# A page is made of fragments, which are made of forms and components, which read the contexts.
[contracts.web-layers]
type = "layers"
name = "The web app's folders stack in layers, from the pages down"
layers = [
    "apps/web/src/routes",
    "apps/web/src/fragments",
    "apps/web/src/forms",
    "apps/web/src/components",
    "apps/web/src/contexts",
    "apps/web/src/validators",
    "apps/web/src/lib",
    "apps/web/src/utils",
    "apps/web/src/config | apps/web/src/assets",
]
guidance = "Move the shared code down to the lower folder, or pass it in from the higher one."

[contracts.web-ui-primitives]
type = "forbidden"
name = "The UI primitives don't know about the app"
from = ["apps/web/src/components/ui"]
to = [{ path = "apps/web/src", except = ["apps/web/src/components/ui", "apps/web/src/lib/utils"] }]
guidance = "components/ui holds the shadcn primitives. Build what is particular to the game or a page in components/, on top of them."

# The tRPC router and the socket handlers, with the context that they share, call the controllers,
# which keep the rules and read and write the database through the models. lib/ has the database,
# the logger and the rate limits underneath.
[contracts.server-layers]
type = "layers"
name = "The server stacks in layers, from its interfaces down to its helpers"
layers = [
    "apps/server/src/index | apps/server/src/scripts",
    "apps/server/src/interface",
    "apps/server/src/controllers",
    "apps/server/src/models : apps/server/src/schemas : apps/server/src/repos",
    "apps/server/src/lib",
    "apps/server/src/config",
    "apps/server/src/utils",
]
guidance = "Move the shared code down to the lower layer, or pass it in from the higher one."

[contracts.server-models-behind-controllers]
type = "protected"
name = "Only the controllers use the database models"
modules = ["apps/server/src/models"]
allowed_importers = ["apps/server/src/controllers"]
guidance = "Go through a controller, which keeps the rules about a document in one place."

[contracts.engine-imports-no-libraries]
type = "forbidden"
name = "The engine is game logic, which imports no libraries"
from = ["packages/engine/src"]
to = ["npm:*", "node:*"]
allow_indirect_imports = true
guidance = "The browser, the server and the bots all run the engine, so keep what needs a library outside it."

[contracts.mongoose-behind-database]
type = "protected"
name = "Only the models and the database module use Mongoose"
modules = ["npm:mongoose"]
allowed_importers = [
    "apps/server/src/models",
    "apps/server/src/lib/database",
    "apps/server/src/scripts/ping-db",
    "apps/server/test",
]
guidance = "Query through a model, or add what you need to lib/database.ts."

[contracts.sharp-behind-images]
type = "protected"
name = "Only the image controller uses sharp"
modules = ["npm:sharp"]
allowed_importers = ["apps/server/src/controllers/image", "apps/server/src/controllers/image.spec"]
guidance = "Process images in the image controller, which re-encodes every upload."

[contracts.aws-behind-image-repo]
type = "protected"
name = "Only the image repository uses the AWS SDK"
modules = ["npm:@aws-sdk/*"]
allowed_importers = ["apps/server/src/repos/image"]
guidance = "Store files through an image repository, which also has a local one for development."

[contracts.credentials-behind-auth]
type = "protected"
name = "Only the auth controller hashes passwords and signs tokens"
modules = ["npm:jsonwebtoken", "npm:argon2"]
allowed_importers = ["apps/server/src/controllers/auth"]
guidance = "Ask the auth controller to hash or check a password, or to make or verify tokens."

[contracts.sockets-behind-socket-interface]
type = "protected"
name = "Only the socket interface uses the socket server"
modules = ["npm:socket.io", "npm:zod-sockets"]
allowed_importers = ["apps/server/src/interface/socket"]
guidance = "Handle socket events in interface/socket, and call the controllers from there."

[contracts.socket-client-behind-lobby-clients]
type = "protected"
name = "Only the web app's lobby store and a bot's connection open a socket"
modules = ["npm:socket.io-client"]
allowed_importers = ["apps/web/src/contexts/lobby", "packages/bots/src/connect", "apps/server/test"]
guidance = "In the web app, read the lobby from the lobby store and send through its actions; a bot connects with `connectBot`."

# Each bot strategy decides its moves its own way, so they have nothing to do with one another.
[contracts.bot-strategies-independent]
type = "independence"
name = "The bot strategies have nothing to do with one another"
modules = ["packages/bots/src/strategies/*"]
guidance = "Share what strategies have in common through what a bot is, beside them, or pass one strategy to another, as the model strategy takes its fallback."

[contracts.bots-know-no-strategy]
type = "forbidden"
name = "What a bot is doesn't depend on how any bot decides its moves"
# The package's index hands the strategies on, and is no part of what a bot is.
from = [{ path = "packages/bots/src", except = ["packages/bots/src/strategies", "packages/bots/src/index"] }]
to = ["packages/bots/src/strategies"]
guidance = "A strategy is a black box behind the `Strategy` interface, which a bot is handed when it is made."

[contracts.game-knows-no-bots]
type = "forbidden"
name = "The game and its apps know nothing about bots"
from = ["pkg:@durachok/web", "pkg:@durachok/server", "pkg:@durachok/engine", "pkg:@durachok/transport"]
to = ["pkg:@durachok/bots"]
guidance = "A bot is a client of the lobby protocol like any other; the server only knows that a player is a bot, from its registry."
