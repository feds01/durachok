name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint-format:
        name: Lint & Format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run oxlint
              run: bun run lint

            - name: Check formatting
              run: bun run fmt:check

    architecture:
        name: Architecture
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            # Installs the zenith version pinned in bun.lock, which the action then runs.
            - name: Install dependencies
              run: bun install --frozen-lockfile

            - uses: feds01/zenith@v0.7.0
              with:
                  binary: node_modules/.bin/zenith
                  # Pull requests from forks can't upload to code scanning, so annotate them instead.
                  upload-sarif: ${{ github.event.pull_request.head.repo.fork != true }}

    typecheck:
        name: Type Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Type check
              run: bun run check

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run tests
              run: bun run test

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: [lint-format, architecture, typecheck, test]
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build
              run: bun run build
