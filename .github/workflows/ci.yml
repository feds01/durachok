name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint-format:
        name: Lint & Format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            - uses: extractions/setup-just@v4

            - name: Install dependencies
              run: just install

            - name: Run oxlint
              run: just lint

            - name: Check formatting
              run: just fmt-check

    architecture:
        name: Architecture
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            - uses: extractions/setup-just@v4

            # Installs the zenith version pinned in bun.lock, which the action then runs.
            - name: Install dependencies
              run: just install

            - uses: feds01/zenith@v0.7.0
              with:
                  binary: node_modules/.bin/zenith
                  # Pull requests from forks can't upload to code scanning, so annotate them instead.
                  upload-sarif: ${{ github.event.pull_request.head.repo.fork != true }}

    typecheck:
        name: Type Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            - uses: extractions/setup-just@v4

            - name: Install dependencies
              run: just install

            - name: Type check
              run: just typecheck

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            - uses: extractions/setup-just@v4

            - name: Install dependencies
              run: just install

            # The server's tests play games through it, against a real MongoDB, as a
            # replica set of one, since the server changes lobbies in transactions. A
            # service container can't be started as one, so it runs here. MongoDB 8
            # refuses to start on the runner's kernel (6.19 or newer, SERVER-121912), so
            # CI runs MongoDB 7.
            - name: Start MongoDB
              run: |
                  docker run --detach --name mongo --publish 27017:27017 mongo:7 --replSet rs0
                  for attempt in $(seq 60); do
                      docker exec mongo mongosh --quiet --eval "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) } quit(db.hello().isWritablePrimary ? 0 : 1)" && exit 0
                      sleep 1
                  done
                  echo "MongoDB didn't start as a replica set" >&2
                  exit 1

            - name: Run tests
              run: just test

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: [lint-format, architecture, typecheck, test]
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            - uses: extractions/setup-just@v4

            - name: Install dependencies
              run: just install

            - name: Build
              run: just build
