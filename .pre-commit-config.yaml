repos:
    - repo: local
      hooks:
          - id: oxlint
            name: oxlint
            entry: just lint --fix
            language: system
            types_or: [javascript, jsx, ts, tsx]
            pass_filenames: true

          - id: oxfmt
            name: oxfmt
            entry: just fmt
            language: system
            types_or: [javascript, jsx, ts, tsx, json, toml]
            pass_filenames: true

          - id: zenith
            name: zenith
            entry: just architecture --tracked
            language: system
            files: (\.(js|jsx|ts|tsx)|package\.json|tsconfig.*\.json|zenith\.toml)$
            pass_filenames: false

          - id: typecheck
            name: typecheck
            entry: just typecheck
            language: system
            types_or: [ts, tsx]
            pass_filenames: false
